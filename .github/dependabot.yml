version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node types track the supported Node.js 22 and 24 LTS runtimes declared
      # in this package's engines field, matching the scaffold policy below.
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
    labels:
      - dependencies
      - development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
