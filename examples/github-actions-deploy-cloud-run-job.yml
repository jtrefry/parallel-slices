# Copy and rename this workflow for each Cloud Run Job. Configure the listed
# repository variables before enabling it. Scheduled work must run as a Cloud
# Run Job invoked by Cloud Scheduler, never as a Cloud Function.
name: Deploy Cloud Run Job

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-job
  cancel-in-progress: false

jobs:
  deploy-job:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate for Artifact Registry without a workspace credential file
        id: registry-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Log in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.registry-auth.outputs.access_token }}

      - name: Define immutable job image
        id: image
        shell: bash
        run: >-
          echo "name=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.GCP_JOB_IMAGE_NAME }}:${GITHUB_SHA}"
          >> "$GITHUB_OUTPUT"

      - name: Build and push job container
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ vars.GCP_JOB_DOCKER_CONTEXT || '.' }}
          file: ${{ vars.GCP_JOB_DOCKERFILE }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}

      - name: Authenticate for Cloud Run Job deployment
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Run Job
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          job: ${{ vars.GCP_CLOUD_RUN_JOB }}
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          flags: >-
            --service-account=${{ vars.GCP_JOB_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ vars.GCP_CLOUD_SQL_INSTANCE }}
            --set-secrets=DATABASE_URL=${{ vars.GCP_DATABASE_URL_SECRET }}:latest
            --tasks=1
            --max-retries=3
