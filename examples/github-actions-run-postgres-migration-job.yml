# This workflow executes an existing, reviewed Cloud Run migration Job. It does
# not create migrations or choose deployment ordering. Enable it only after the
# project's expand/contract, backup, compatibility, and rollback policy is set.
name: Run PostgreSQL Migration Job

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: postgres-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out main for an auditable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MIGRATION_INVOKER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Execute migration job and wait for success
        run: >-
          gcloud run jobs execute "${{ vars.GCP_MIGRATION_JOB }}"
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.GCP_REGION }}"
          --wait
