<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Parallel Slices planning and build workflow</title>
  <desc id="desc">A planner robot places instructions on an assembly line, a centered builder robot assembles feature modules behind it, and the completed application rests on a display stand.</desc>

  <!-- Builder robot centered behind the assembly line. -->
  <g stroke="#0aa1f8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="736" y="194" width="36" height="76" rx="17" fill="#ffffff" />
    <rect x="1028" y="194" width="36" height="76" rx="17" fill="#ffffff" />
    <path fill="#ffffff" d="M802 96h196l60 122-60 122H802l-60-122 60-122Z" />
    <path fill="#0aa1f8" d="M836 158h128l42 60-42 60H836l-42-60 42-60Z" />
    <circle cx="870" cy="218" r="18" fill="#ffffff" stroke="none" />
    <circle cx="930" cy="218" r="18" fill="#ffffff" stroke="none" />

    <path fill="#ffffff" d="M842 354h116l20 194-30 70h-96l-30-70 20-194Z" />
    <path fill="none" d="M838 548h124" />
    <rect x="870" y="618" width="60" height="176" rx="16" fill="#ffffff" />
    <rect x="810" y="780" width="180" height="88" rx="24" fill="#ffffff" />
    <circle cx="852" cy="824" r="17" fill="#fa6d02" stroke="none" />
    <circle cx="948" cy="824" r="17" fill="#0aa1f8" stroke="none" />
  </g>

  <!-- Planner's upper arm begins behind the body, hiding its shoulder joint. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#0aa1f8" stroke-width="48" d="m244 450 62 48 54 42" />
    <path stroke="#ffffff" stroke-width="20" d="m244 450 62 48 54 42" />
    <circle cx="306" cy="498" r="23" fill="#ffffff" stroke="#0aa1f8" stroke-width="18" />
  </g>

  <!-- Planner robot at the input side. -->
  <g stroke="#0aa1f8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path fill="none" d="M190 140V98" />
    <circle cx="190" cy="70" r="25" fill="#0aa1f8" />
    <rect x="28" y="226" width="34" height="72" rx="16" fill="#ffffff" />
    <rect x="316" y="226" width="34" height="72" rx="16" fill="#ffffff" />
    <rect x="50" y="144" width="278" height="236" rx="116" fill="#ffffff" />
    <rect x="120" y="210" width="180" height="108" rx="52" fill="#0aa1f8" />
    <circle cx="178" cy="264" r="17" fill="#ffffff" stroke="none" />
    <circle cx="252" cy="264" r="17" fill="#ffffff" stroke="none" />

    <path fill="#ffffff" d="M132 388h114l18 190-28 62h-94l-28-62 18-190Z" />
    <path fill="none" d="M130 572h118" />
    <rect x="160" y="640" width="58" height="168" rx="16" fill="#ffffff" />
    <rect x="98" y="794" width="182" height="88" rx="24" fill="#ffffff" />
    <circle cx="140" cy="838" r="17" fill="#0aa1f8" stroke="none" />
    <circle cx="238" cy="838" r="17" fill="#fa6d02" stroke="none" />
  </g>

  <!-- The finished software product and its display stand. -->
  <g stroke="#0aa1f8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1508" y="666" width="66" height="184" rx="18" fill="#ffffff" />
    <rect x="1418" y="838" width="246" height="88" rx="24" fill="#ffffff" />
    <circle cx="1460" cy="882" r="17" fill="#fa6d02" stroke="none" />
    <circle cx="1622" cy="882" r="17" fill="#0aa1f8" stroke="none" />

    <rect x="1320" y="414" width="430" height="266" rx="30" fill="#ffffff" />
    <path fill="none" d="M1320 474h430" />
    <circle cx="1360" cy="444" r="10" fill="#fa6d02" stroke="none" />
    <circle cx="1394" cy="444" r="10" fill="#0aa1f8" stroke="none" />

    <rect x="1352" y="506" width="58" height="132" rx="29" fill="#0aa1f8" stroke="none" />
    <circle cx="1381" cy="538" r="8" fill="#ffffff" stroke="none" />
    <circle cx="1381" cy="572" r="8" fill="#ffffff" stroke="none" />
    <circle cx="1381" cy="606" r="8" fill="#ffffff" stroke="none" />

    <rect x="1438" y="510" width="174" height="56" rx="28" fill="#fa6d02" stroke="none" />
    <circle cx="1472" cy="538" r="12" fill="#ffffff" stroke="none" />
    <rect x="1500" y="529" width="80" height="18" rx="9" fill="#ffffff" stroke="none" />

    <path fill="#0aa1f8" stroke="none" d="M1652 522h50l25 37-25 37h-50l-25-37 25-37Z" />
    <rect x="1648" y="566" width="10" height="16" rx="3" fill="#ffffff" stroke="none" />
    <rect x="1664" y="554" width="10" height="28" rx="3" fill="#ffffff" stroke="none" />
    <rect x="1680" y="540" width="10" height="42" rx="3" fill="#fa6d02" stroke="none" />
    <rect x="1696" y="550" width="10" height="32" rx="3" fill="#ffffff" stroke="none" />
  </g>

  <!-- Assembly line in front of the builder. -->
  <g stroke="#0aa1f8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="350" y="680" width="910" height="250" rx="34" fill="#ffffff" />
    <path fill="none" d="M350 750h910" />
    <circle cx="458" cy="856" r="30" fill="#fa6d02" stroke="none" />
    <circle cx="650" cy="856" r="30" fill="#0aa1f8" stroke="none" />
    <circle cx="842" cy="856" r="30" fill="#fa6d02" stroke="none" />
    <circle cx="1034" cy="856" r="30" fill="#0aa1f8" stroke="none" />
    <circle cx="1170" cy="856" r="30" fill="#fa6d02" stroke="none" />
    <path fill="#ffffff" d="M422 930v96h100v-96M1088 930v96h100v-96" />
  </g>

  <!-- Planner instructions entering the workflow. -->
  <g stroke="#0aa1f8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffffff" d="M400 500h104l42 42v136H400V500Z" />
    <path fill="none" d="M504 500v42h42" />
    <circle cx="430" cy="554" r="9" fill="#fa6d02" stroke="none" />
    <path fill="none" d="M456 554h58" />
    <circle cx="430" cy="594" r="9" fill="#0aa1f8" stroke="none" />
    <path fill="none" d="M456 594h58" />
    <circle cx="430" cy="634" r="9" fill="#fa6d02" stroke="none" />
    <path fill="none" d="M456 634h42" />
  </g>

  <!-- Feature modules being assembled by the builder. -->
  <g>
    <rect x="620" y="558" width="60" height="116" rx="30" fill="#0aa1f8" />
    <circle cx="650" cy="588" r="8" fill="#ffffff" />
    <circle cx="650" cy="616" r="8" fill="#ffffff" />
    <circle cx="650" cy="644" r="8" fill="#ffffff" />

    <rect x="754" y="584" width="168" height="62" rx="31" fill="#fa6d02" />
    <circle cx="788" cy="615" r="13" fill="#ffffff" />
    <rect x="816" y="605" width="74" height="20" rx="10" fill="#ffffff" />

    <path fill="#0aa1f8" d="M1012 554h96l48 60-48 60h-96l-48-60 48-60Z" />
    <rect x="998" y="626" width="20" height="24" rx="5" fill="#ffffff" />
    <rect x="1028" y="604" width="20" height="46" rx="5" fill="#ffffff" />
    <rect x="1058" y="578" width="20" height="72" rx="5" fill="#fa6d02" />
    <rect x="1088" y="594" width="20" height="56" rx="5" fill="#ffffff" />
  </g>

  <!-- Planner's foreground arm steadies the instruction document. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#0aa1f8" stroke-width="48" d="m244 512 62 108 54 20" />
    <path stroke="#ffffff" stroke-width="20" d="m244 512 62 108 54 20" />
    <circle cx="244" cy="512" r="23" fill="#ffffff" stroke="#0aa1f8" stroke-width="18" />
    <circle cx="306" cy="620" r="23" fill="#ffffff" stroke="#0aa1f8" stroke-width="18" />
  </g>
  <g fill="#ffffff" stroke="#0aa1f8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="360" cy="540" r="16" />
    <path fill="none" d="m370 540 14-16M370 540l14 16" />
    <circle cx="360" cy="640" r="16" />
    <path fill="none" d="m370 640 14-16M370 640l14 16" />
  </g>

  <!-- Builder arms work above the feature modules. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#0aa1f8" stroke-width="48" d="m838 438-76 42-62 54" />
    <path stroke="#ffffff" stroke-width="20" d="m838 438-76 42-62 54" />
    <circle cx="838" cy="438" r="23" fill="#ffffff" stroke="#0aa1f8" stroke-width="18" />
    <circle cx="762" cy="480" r="23" fill="#ffffff" stroke="#0aa1f8" stroke-width="18" />

    <path stroke="#0aa1f8" stroke-width="48" d="m962 458 88 12 115 40" />
    <path stroke="#ffffff" stroke-width="20" d="m962 458 88 12 115 40" />
    <circle cx="962" cy="458" r="23" fill="#ffffff" stroke="#0aa1f8" stroke-width="18" />
    <circle cx="1050" cy="470" r="23" fill="#ffffff" stroke="#0aa1f8" stroke-width="18" />
  </g>
  <g fill="#ffffff" stroke="#0aa1f8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="700" cy="534" r="16" />
    <path fill="none" d="m700 546-20 30M700 546l20 30" />
    <circle cx="1165" cy="510" r="18" />
    <path fill="none" d="m1165 524-22 24M1165 524l22 24" />
  </g>
</svg>
